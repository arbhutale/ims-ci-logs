when:
  - event: [push, manual]

steps:
  - name: deploy-tracer
    image: alpine:latest
    when:
      - branch: [dev, main]
        event: [push, manual]
    environment:
      SERVER_SSH_KEY:
        from_secret: SERVER_SSH_KEY
    commands:
      - apk add --no-cache openssh-client tar
      - mkdir -p ~/.ssh && echo "$SERVER_SSH_KEY" > ~/.ssh/id_rsa && chmod 600 ~/.ssh/id_rsa
      - echo "📦 Archiving Observability UI..."
      - tar --exclude='.git' -czf /tmp/ci-logs.tar.gz .
      - echo "🚀 Syncing to remote server 157.180.82.28..."
      - ssh -o StrictHostKeyChecking=no root@157.180.82.28 mkdir -p /opt/ims/ims-ci-logs
      - scp -o StrictHostKeyChecking=no /tmp/ci-logs.tar.gz root@157.180.82.28:/tmp/ci-logs.tar.gz
      - ssh -o StrictHostKeyChecking=no root@157.180.82.28 tar -xzf /tmp/ci-logs.tar.gz -C /opt/ims/ims-ci-logs
      - ssh -o StrictHostKeyChecking=no root@157.180.82.28 rm -f /tmp/ci-logs.tar.gz
      - echo "🔨 Building and deploying Tracer UI..."
      - ssh -o StrictHostKeyChecking=no root@157.180.82.28 cp /opt/ims/ims-ci-logs/scripts/deploy.sh /opt/ims/deploy.sh
      - ssh -o StrictHostKeyChecking=no root@157.180.82.28 chmod +x /opt/ims/deploy.sh
      - ssh -o StrictHostKeyChecking=no root@157.180.82.28 /opt/ims/deploy.sh tracer-ui dev dev
      - echo "✅ Tracer UI successfully deployed with latest changes!"
